# Require a current Zephyr SDK/board support package with a QSPI flash driver.
# Include this file in the production west build after reserving the `storage`
# partition declared in teensy41.overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y

# Independent MCU recovery. It is armed only after hardware discovery and fed
# exclusively by the control owner after a complete health checkpoint.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
