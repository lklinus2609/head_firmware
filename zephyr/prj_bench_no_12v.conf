# Robot-head USB/protocol bench image for a PCB with no 12 V branch power.
# It deliberately omits flash/NVS and all servo/fan I/O from the build.
# Keep the normal head transport console-silent. The required early CDC
# initialization is set in prj.conf. Install stdout's hook as required by the
# Teensy legacy CDC stack, but do not emit boot text or log output.
CONFIG_STDOUT_CONSOLE=y
CONFIG_USB_DEVICE_PRODUCT="Head Controller NO-12V Bench"
CONFIG_UART_ASYNC_API=n
CONFIG_PWM=n
CONFIG_GPIO=n
