# Runtime and deterministic scheduling
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_TIMESLICING=n
CONFIG_ASSERT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Zephyr's Teensy 4.1 legacy CDC ACM implementation requires its console
# endpoint to initialize early. CDC0 is diagnostics only; the binary head
# protocol is carried by separate CDC1, so its stream cannot be contaminated.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_BACKEND_UART=y

# USB CDC host link
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Head Teensy Controller"
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_ASYNC_API=y

# Board I/O
CONFIG_GPIO=y
CONFIG_PWM=y
